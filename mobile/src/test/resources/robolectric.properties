# Real rendering rather than the no-op canvas.
#
# Robolectric's legacy graphics mode draws nothing at all: every captured bitmap comes back a
# uniform transparent field, so a screenshot suite running under it passes every test forever while
# proving nothing. NATIVE mode runs the actual Android rendering pipeline.
graphicsMode=NATIVE

# The phone's floor is API 26, but Robolectric's native graphics need a newer framework to render
# Compose. Tests run on the newest supported level; the instrumented suite covers real devices.
sdk=34
