org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
kotlin.compiler.execution.strategy=in-process


# The single source of the phone app's version name. The release workflow appends a short commit sha
# on anything that is not a tag build, and passes mobile.versionCode from the run number, so a
# rolling build is always distinguishable from the tagged release it came after.
mobile.version=0.1.0
