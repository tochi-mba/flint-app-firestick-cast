[package]
name = "flint-engine"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
authors = ["REX Technologies"]
description = "Flint capture, encode and transport engine. The hot path."
license = "MIT"
publish = false

[lib]
# cdylib for the C# host to load; rlib so the benches and tests can link it directly.
crate-type = ["cdylib", "rlib"]

[dependencies]

[target.'cfg(windows)'.dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Gdi",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    # ICodecAPI takes its settings as VARIANTs; this is what makes the encoder's low-latency
    # controls reachable, and without them the software encoder buffers about seventeen frames
    # before emitting anything at all.
    "Win32_System_Variant",
]

[profile.release]
# The frame path must not be at the mercy of cross-crate inlining decisions, and a panic that
# unwinds through the FFI boundary is undefined behaviour, so it aborts instead.
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
