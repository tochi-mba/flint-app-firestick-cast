# One place for every JVM and Android version in the build.
#
# Before this file, each version was a literal repeated across the module build files, and the only
# thing keeping them in step was that someone remembered. Four modules is where that stops working:
# :phone:app, :phone:design and :receiver:app all compose against the same Compose BOM, and a BOM
# that differs between two of them produces a link error a long way from its cause.
#
# Rules for adding an entry:
#   - Pin an exact version. A range makes a build that passed today fail tomorrow for no commit.
#   - Put the reason in a comment when the version is not simply "the newest one".

[versions]
# Toolchain
# The JDK every module compiles against. The workflows install this same version by hand, and that
# copy is the only one outside this file.
jdk = "17"
agp = "9.4.0"
kotlin = "2.4.20"
jacoco = "0.8.14"
ktlint = "1.8.0"

# Android platform
compile-sdk = "36"
target-sdk = "36"
# Fire OS 6 reports API 25, which is what keeps the receiver's floor that low. A phone has no such
# constraint, and 26 is what makes NotificationChannel unconditional and the hardware-backed
# keystore dependable, so the phone app does not carry branches for devices nobody casts from.
mobile-min-sdk = "26"
receiver-min-sdk = "25"

# AndroidX
androidx-core = "1.16.0"
androidx-activity-compose = "1.13.0"
# A floor rather than the resolved version: activity-compose already brings lifecycle in, and naming
# it here is about the phone app using it directly rather than by accident through somebody else's
# api dependency.
androidx-lifecycle = "2.8.0"
# 1.3 is where savedstate-ktx became an empty shim and setViewTreeSavedStateRegistryOwner moved into
# the main artifact, which is the function the second screen's Presentation needs.
androidx-savedstate = "1.3.0"
compose-bom = "2026.05.00"
androidx-tv-material = "1.1.0"
androidx-webkit = "1.12.1"
media3 = "1.10.1"

# Third party
coroutines = "1.11.0"
zxing = "3.5.4"
bouncycastle = "1.86"
wireguard = "1.0.20260102"
desugar = "2.1.5"

# Test
junit = "4.13.2"
robolectric = "4.17"
androidx-test-core = "1.7.0"
androidx-test-ext-junit = "1.3.0"
androidx-test-runner = "1.7.0"
androidx-test-uiautomator = "2.4.0"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity-compose" }
androidx-lifecycle-runtime = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "androidx-lifecycle" }
# Declared because SecondScreenHost's Presentation supplies all three ViewTree owners itself, so it
# uses ViewModelStore and the saved-state registry directly rather than through activity-compose.
androidx-lifecycle-viewmodel = { module = "androidx.lifecycle:lifecycle-viewmodel", version.ref = "androidx-lifecycle" }
androidx-savedstate = { module = "androidx.savedstate:savedstate", version.ref = "androidx-savedstate" }

compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }

androidx-tv-material = { module = "androidx.tv:tv-material", version.ref = "androidx-tv-material" }
androidx-webkit = { module = "androidx.webkit:webkit", version.ref = "androidx-webkit" }

media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
media3-exoplayer-dash = { module = "androidx.media3:media3-exoplayer-dash", version.ref = "media3" }
media3-exoplayer-hls = { module = "androidx.media3:media3-exoplayer-hls", version.ref = "media3" }
media3-ui = { module = "androidx.media3:media3-ui", version.ref = "media3" }

kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
zxing-core = { module = "com.google.zxing:core", version.ref = "zxing" }
bouncycastle-pkix = { module = "org.bouncycastle:bcpkix-jdk18on", version.ref = "bouncycastle" }
wireguard-tunnel = { module = "com.wireguard.android:tunnel", version.ref = "wireguard" }
desugar-jdk-libs = { module = "com.android.tools:desugar_jdk_libs", version.ref = "desugar" }

junit = { module = "junit:junit", version.ref = "junit" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidx-test-core" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-ext-junit" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test-runner" }
androidx-test-uiautomator = { module = "androidx.test.uiautomator:uiautomator", version.ref = "androidx-test-uiautomator" }

# What the convention plugins in tools/build-logic compile against. The build that applies them
# already has these on its classpath, at the same versions.
android-gradle-plugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }

# Run as a plain JavaExec rather than through a Gradle plugin. The plugin has to track both Gradle
# and Kotlin releases to keep working; the command-line distribution only has to be on the
# classpath, so the lint gate cannot be what breaks a Gradle upgrade.
ktlint-cli = { module = "com.pinterest.ktlint:ktlint-cli", version.ref = "ktlint" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
