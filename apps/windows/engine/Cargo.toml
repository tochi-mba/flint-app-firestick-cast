[package]
name = "flint-engine"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
authors = ["REX Technologies"]
description = "Flint capture, encode and transport engine. The hot path."
license = "MIT"
publish = false

[lib]
# cdylib for the C# host to load; rlib so the benches and tests can link it directly.
crate-type = ["cdylib", "rlib"]

[dependencies]

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Gdi",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    # ICodecAPI takes its settings as VARIANTs; this is what makes the encoder's low-latency
    # controls reachable, and without them the software encoder buffers about seventeen frames
    # before emitting anything at all.
    "Win32_System_Variant",
]

# Held to a stated set on top of clippy's defaults. CI denies warnings, so each entry is a rule rather
# than a suggestion.
[lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[lints.clippy]
# Every unsafe block says why it is sound. In a C ABI and a COM layer a mistake is undefined
# behaviour rather than a wrong answer, so the argument is written down where the block is.
undocumented_unsafe_blocks = "warn"
# A subset of pedantic: the lints that catch real mistakes or keep the code uniform. The numeric-cast
# family is left out on purpose, because a codec and a C ABI trip it on nearly every line by design.
borrow_as_ptr = "warn"
case_sensitive_file_extension_comparisons = "warn"
cast_lossless = "warn"
checked_conversions = "warn"
default_trait_access = "warn"
doc_markdown = "warn"
explicit_iter_loop = "warn"
format_push_string = "warn"
if_not_else = "warn"
implicit_clone = "warn"
inefficient_to_string = "warn"
manual_assert = "warn"
manual_let_else = "warn"
map_unwrap_or = "warn"
match_wildcard_for_single_variants = "warn"
missing_fields_in_debug = "warn"
needless_continue = "warn"
ptr_as_ptr = "warn"
ptr_cast_constness = "warn"
redundant_closure_for_method_calls = "warn"
redundant_else = "warn"
semicolon_if_nothing_returned = "warn"
single_match_else = "warn"
uninlined_format_args = "warn"
unnested_or_patterns = "warn"
used_underscore_binding = "warn"

[profile.release]
# The frame path must not be at the mercy of cross-crate inlining decisions, and a panic that
# unwinds through the FFI boundary is undefined behaviour, so it aborts instead.
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
