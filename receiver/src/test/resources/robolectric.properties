# Real rendering rather than the no-op canvas.
#
# Robolectric's legacy graphics mode draws nothing at all: every captured bitmap comes back a
# uniform transparent field, so a screenshot suite running under it passes every test forever while
# proving nothing. NATIVE mode runs the actual Android rendering pipeline, which is the only way a
# captured frame reflects what a Fire TV would put on the panel.
graphicsMode=NATIVE

# The receiver targets Fire OS devices reporting API 25 upward, but Robolectric's native graphics
# need a newer framework than 25 to render Compose. Tests run on the newest supported level and the
# instrumented suite covers the real device.
sdk=34
