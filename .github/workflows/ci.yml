# The same checks scripts/build.ps1 runs locally, so a green local run means a green CI run.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # Windows only: the host probe reads the driver registry and the engine links against Win32.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install the .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android build tools
        shell: pwsh
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            flint-engine/target
          key: cargo-${{ runner.os }}-${{ hashFiles('flint-engine/Cargo.toml') }}

      - name: Build and test
        shell: pwsh
        run: ./scripts/build.ps1

      - name: Test Fire TV receiver
        shell: pwsh
        run: ./gradlew.bat --no-daemon :receiver:testDebugUnitTest --console plain

      - name: Check the site
        shell: pwsh
        run: python scripts/check-site.py
