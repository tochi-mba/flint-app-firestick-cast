# The same checks scripts/build.ps1 runs locally, so a green local run means a green CI run.
name: CI

# The phone app lives in the same repository but shares none of this job's toolchains, so a change
# confined to it does not run three toolchains on a Windows runner to prove nothing. Anything the
# two builds genuinely share -- :protocol, the golden corpus, the Gradle files -- is deliberately
# absent from this list, so a change there still runs both.
#
# If this workflow is ever made a required status check, add the same paths to the branch rule's
# exemptions: GitHub reports a path-filtered workflow as pending rather than passing, and a
# mobile-only pull request would wait for a job that is never going to start.
on:
  push:
    branches: [master]
    paths-ignore:
      - 'mobile/**'
      - 'design/**'
      - 'castcore/**'
      - '.github/workflows/mobile.yml'
      - '.github/workflows/mobile-release.yml'
  pull_request:
    # Duplicated rather than shared: GitHub Actions does not resolve YAML anchors.
    paths-ignore:
      - 'mobile/**'
      - 'design/**'
      - 'castcore/**'
      - '.github/workflows/mobile.yml'
      - '.github/workflows/mobile-release.yml'
  workflow_dispatch:

permissions:
  contents: read

# A second push supersedes the first. Three toolchains on a Windows runner is a slow job, and
# queueing runs for commits nobody is waiting on wastes the minutes that matter.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Windows only: the host probe reads the driver registry and the engine links against Win32.
    runs-on: windows-latest
    # Well past a cold run with empty caches; short enough that a hung gradle daemon or a
    # credential prompt fails visibly instead of burning an hour.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Install the .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Not the action's default packages: that list names the legacy `tools` package, which Google
      # has removed, so the default fails before anything builds. See the phone-gate action.
      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android build tools
        shell: pwsh
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            flint-engine/target
          key: cargo-${{ runner.os }}-${{ hashFiles('flint-engine/Cargo.toml') }}

      - name: Build and test
        shell: pwsh
        run: ./scripts/build.ps1

      # The same gate as the local one. Protocol tests and lint were missing, so a wire
      # change that broke Kotlin, or a lint regression, could pass CI and fail on a television.
      #
      # :protocol:check rather than :protocol:test, because the module declares a 95% line and
      # 85% branch coverage rule that nothing here was running. It had been failing quietly at
      # 81% ever since the browser codecs landed untested.
      - name: Test Fire TV receiver
        shell: pwsh
        run: >
          ./gradlew.bat --no-daemon
          :protocol:check :receiver:testDebugUnitTest :receiver:lintDebug
          --console plain

      # Reports are the only way to see which case failed once the runner is gone.
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            receiver/build/reports/**
            receiver/build/test-results/**
            protocol/build/reports/**
            **/TestResults/**
          retention-days: 7
          if-no-files-found: ignore

      - name: Check the site
        shell: pwsh
        run: python scripts/check-site.py
