# Every check this repository has, run the way a laptop runs them: ./dev.ps1 check <area>.
#
# One workflow rather than several, so there is one place to look for whether a commit is good and
# one check to require on master. The jobs split by toolchain, not by product: the .NET and Rust
# halves need a Windows runner, the Android half does not, and a change to one should not pay for
# the other. What each job runs is the same command a person runs, so a green run here means a green
# run there and the two cannot drift.
#
# Every action is pinned to a commit. A tag can be moved to different code after it is reviewed;
# Dependabot proposes the moves, and this workflow judges them (.github/dependabot.yml).
name: CI

on:
  pull_request:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A newer push supersedes a pull request's run. A run on master or a tag is never cancelled: its
  # result is what the release workflows and the branch rule read.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Which halves of the repository a pull request touches. On master, a tag or a dispatch, all of
  # them: those runs decide what is published, and a filter that guessed wrong there would publish
  # something nothing had checked.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      windows: ${{ steps.decide.outputs.windows }}
      android: ${{ steps.decide.outputs.android }}
      site: ${{ steps.decide.outputs.site }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            # The shared things — the protocol, the version, the build logic and the runner — are
            # deliberately in every list. A change to any of them can break any half.
            shared: &shared
              - 'protocol/**'
              - 'VERSION'
              - 'dev.ps1'
              - 'tools/dev/**'
              - '.editorconfig'
              - '.github/workflows/ci.yml'
            windows:
              - *shared
              - 'apps/windows/**'
              - '*.slnx'
              - 'Directory.*.props'
              - 'Directory.Build.targets'
              - 'NuGet.config'
              - 'global.json'
              - '.config/**'
            android:
              - *shared
              - 'apps/phone/**'
              - 'apps/receiver/**'
              - 'gradle/**'
              - 'gradlew'
              - 'gradlew.bat'
              - '*.gradle.kts'
              - 'gradle.properties'
              - 'tools/build-logic/**'
              - '.github/actions/android-setup/action.yml'
            site:
              - *shared
              - 'site/**'
              - 'tools/scripts/check-site.py'

      - id: decide
        env:
          IS_PULL_REQUEST: ${{ github.event_name == 'pull_request' }}
          WINDOWS: ${{ steps.filter.outputs.windows }}
          ANDROID: ${{ steps.filter.outputs.android }}
          SITE: ${{ steps.filter.outputs.site }}
        run: |
          set -euo pipefail
          for half in windows android site; do
            value=true
            if [ "$IS_PULL_REQUEST" = "true" ]; then
              case "$half" in
                windows) value="${WINDOWS:-false}" ;;
                android) value="${ANDROID:-false}" ;;
                site) value="${SITE:-false}" ;;
              esac
            fi
            echo "$half=$value" >> "$GITHUB_OUTPUT"
            echo "$half: $value"
          done

  # The source rules, the convention plugins, the engine and the .NET solution. Windows because the
  # host probe reads the driver registry and the engine links against Win32.
  windows:
    needs: changes
    if: needs.changes.outputs.windows == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/windows/engine

      # The convention plugins are Kotlin, and the repo area's checks include their own build.
      - name: Install JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      # Declared rather than assumed. The hosted image happens to ship Pester, and a gate that runs
      # only because of that is one image update away from silently not running.
      - name: Install Pester
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable Pester | Where-Object { $_.Version -ge [version]'5.5.0' })) {
            Install-PSResource Pester -Version '[5.7.1,6.0)' -Scope CurrentUser -TrustRepository
          }

      - name: Check the source rules, the build logic, the engine and the Windows app
        shell: pwsh
        run: ./dev.ps1 check repo build-logic engine windows

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-test-reports
          path: '**/TestResults/**'
          retention-days: 7
          if-no-files-found: ignore

  # The protocol, the phone and the receiver, in one Gradle invocation on a runner that needs no
  # Windows toolchain at all.
  android:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/android-setup

      - name: Check the build logic, the protocol, the phone and the receiver
        shell: pwsh
        run: ./dev.ps1 check build-logic protocol phone receiver

      - name: Build the debug APKs
        run: ./gradlew :phone:app:assembleDebug :receiver:app:assembleDebug --console plain

      # So a reviewer can install the branch on a real phone or television instead of taking the
      # diff's word for it.
      - name: Upload the debug APKs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flint-debug-apks
          path: |
            apps/phone/app/build/outputs/apk/debug/*.apk
            apps/receiver/app/build/outputs/apk/debug/*.apk
          retention-days: 7
          if-no-files-found: error

      - name: Upload test and lint reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-test-reports
          path: |
            apps/phone/*/build/reports/**
            apps/phone/*/build/test-results/**
            apps/receiver/app/build/reports/**
            apps/receiver/app/build/test-results/**
            protocol/kotlin/build/reports/**
          retention-days: 7
          if-no-files-found: ignore

  site:
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check the site
        shell: pwsh
        run: ./dev.ps1 check site

  # The one check to require on master. A job that was skipped because its half was untouched counts
  # as passed; a job that failed or was cancelled does not, and `always()` is what makes this run at
  # all in that case.
  ci-ok:
    needs: [changes, windows, android, site]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$RESULTS"
          if echo "$RESULTS" | grep -q '"result": *"\(failure\|cancelled\)"'; then
            echo "At least one check did not pass." >&2
            exit 1
          fi
          echo "Every check that ran passed."
