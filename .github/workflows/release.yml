# The Windows download: an installer, a portable zip, and the feed the installed app updates from.
#
# Two cadences, one job, the same shape as mobile-release.yml. Every merge to the default branch
# replaces a rolling `latest-windows` prerelease, so the download link never changes and always
# points at the newest build; a `v*` tag cuts an immutable release that will still be exactly these
# bytes in five years.
#
# The installer is what the site offers first, because it puts Flint in the Start menu, registers it
# in Add or remove programs, puts `flint` on the PATH, and can update itself. The zip stays for
# anyone who would rather keep a folder they can delete.
name: Release

# Deliberately unfiltered by path, for the reason mobile-release.yml gives: a tag push is matched
# against the diff of whatever commit it names, so a `v*` tag on a commit that touched nothing under
# a filtered path would be skipped silently. A release that does not happen is the worse failure.
on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-release
  cancel-in-progress: false

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install the .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy, rustfmt

      # The package carries the Fire TV receiver, so this job needs the Android toolchain too.
      - uses: ./.github/actions/android-setup

      - name: Install Pester
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable Pester | Where-Object { $_.Version -ge [version]'5.5.0' })) {
            Install-PSResource Pester -Version '[5.7.1,6.0)' -Scope CurrentUser -TrustRepository
          }

      # The version has one source: the VERSION file, which Directory.Build.props, the Gradle build
      # and package.ps1 all read. The tag used to be the version and nothing compared the two, so a
      # package could be named one thing and stamped another (ADR-0028). Now a tag that disagrees
      # fails the release.
      #
      # A rolling build appends the commit, prefixed `g` as git describe does. A short hash can come
      # out all digits with a leading zero, which strict SemVer does not allow in a prerelease label,
      # and dotnet reads Version as a package version. The prefix rules that out rather than leaving
      # it to be discovered on whichever merge happens to draw that hash.
      - name: Resolve the version
        id: version
        shell: pwsh
        run: |
          $base = (Get-Content -LiteralPath VERSION -Raw).Trim()
          if ($base -notmatch '^\d+\.\d+\.\d+$') {
            throw "VERSION holds '$base', which is not a MAJOR.MINOR.PATCH version."
          }
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $tagged = $env:GITHUB_REF -replace '^refs/tags/v', ''
            if ($tagged -ne $base) {
              throw "Tag v$tagged does not match VERSION $base."
            }
            $version = $base
            $isTagged = 'true'
          }
          else {
            $version = "$base-g$($env:GITHUB_SHA.Substring(0, 7))"
            $isTagged = 'false'
          }
          "value=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "tagged=$isTagged" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Version $version (tagged: $isTagged)"

      # A release must never ship code that does not pass its own gate — including the receiver,
      # whose APK goes inside the package this job publishes.
      - name: Build and test
        shell: pwsh
        run: ./dev.ps1 check repo build-logic engine windows receiver

      - name: Package
        shell: pwsh
        run: ./tools/scripts/package.ps1 -Version ${{ steps.version.outputs.value }}

      # Never publish on faith. package.ps1 checks the engine reached the staging folder; this opens
      # the zip that will actually be downloaded and checks what someone extracting it would find,
      # and confirms the installer and the feed the installed app reads were built beside it.
      - name: Verify the package
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.value }}'
          $zip = Join-Path $PWD "dist/Flint-$version-win-x64.zip"
          if (-not (Test-Path -LiteralPath $zip)) {
            throw "No package was produced at $zip."
          }
          $check = Join-Path $env:RUNNER_TEMP 'package-check'
          if (Test-Path -LiteralPath $check) {
            Remove-Item -LiteralPath $check -Recurse -Force
          }
          Expand-Archive -LiteralPath $zip -DestinationPath $check
          foreach ($file in 'Flint.App.exe', 'flint.exe', 'flint_engine.dll', 'Flint.Receiver.apk', 'INSTALL.md') {
            if (-not (Test-Path -LiteralPath (Join-Path $check $file))) {
              throw "The package is missing $file."
            }
          }
          # Documentation XML is generated so the analyzers can see unused usings. It carries every
          # internal comment in the codebase and has no business in a download.
          $docs = @(Get-ChildItem -LiteralPath $check -Filter *.xml -Recurse)
          if ($docs.Count -gt 0) {
            throw "The package contains documentation XML: $($docs.Name -join ', ')."
          }
          foreach ($artefact in "Flint-Setup-$version.exe", 'Flint-Setup.exe', 'releases.win.json') {
            if (-not (Test-Path -LiteralPath (Join-Path $PWD "dist/$artefact"))) {
              throw "The installer set is missing $artefact."
            }
          }
          $size = [math]::Round((Get-Item -LiteralPath $zip).Length / 1MB, 1)
          $setup = [math]::Round((Get-Item -LiteralPath "dist/Flint-Setup-$version.exe").Length / 1MB, 1)
          Write-Host "Verified $zip ($size MB) and the installer ($setup MB)"

      # A rolling release is mutable by design: take the previous build's assets off before uploading
      # these, so the release never offers two versions side by side.
      - name: Clear previous rolling assets
        if: steps.version.outputs.tagged == 'false' && github.ref == 'refs/heads/master'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest-windows --json tagName | Out-Null
          if ($LASTEXITCODE -ne 0) {
            Write-Host 'No rolling Windows release exists yet; nothing to clear.'
            exit 0
          }
          $assets = gh release view latest-windows --json assets --jq '.assets[].name'
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not list the rolling release assets.'
          }
          foreach ($asset in $assets) {
            if ([string]::IsNullOrWhiteSpace($asset)) { continue }
            gh release delete-asset latest-windows $asset --yes
            if ($LASTEXITCODE -ne 0) {
              throw "Could not delete $asset from the rolling release."
            }
          }

      - name: Publish the rolling prerelease
        # Guarded on the branch as well as the tag. A workflow_dispatch from any other branch builds,
        # packages and verifies, then stops: it must never move the download everyone is sent to onto
        # a branch build.
        if: steps.version.outputs.tagged == 'false' && github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: latest-windows
          target_commitish: ${{ github.sha }}
          name: Flint for Windows (rolling)
          prerelease: true
          make_latest: false
          # The installer, the stable-named copy of it, the portable zip, and the feed an installed
          # Flint reads to update itself.
          files: |
            dist/Flint-Setup-*.exe
            dist/Flint-Setup.exe
            dist/*.zip
            dist/*.nupkg
            dist/releases.win.json
          body: |
            **The newest build of Flint for Windows, replaced on every merge.** Version
            `${{ steps.version.outputs.value }}`. For a build that will not change under you, use a
            `v*` release instead.

            **Windows 10/11, 64-bit.** Download `Flint-Setup.exe` and run it. It installs for your
            account only, needs no administrator, puts Flint in the Start menu, and puts `flint` on
            your PATH so the command works in any terminal. Flint updates itself from this release
            after that; Settings has the switch if you would rather it did not.

            Prefer a folder you can delete? Take the zip instead, extract it, and run
            `Flint.App.exe`. Nothing else is installed, and nothing updates itself.

            The build is not code-signed, so Windows will say "Windows protected your PC": choose
            **More info**, then **Run anyway**. That warning is accurate — Windows does not
            recognise this publisher. Building from source avoids it.

            Check your Fire TV first — **Settings → My Fire TV → About**. Fire OS 7 or 8 works;
            Vega OS cannot, and no future version will change that.

            See the [installation guide](https://github.com/tochi-mba/flint-app-firestick-cast/blob/master/docs/INSTALL.md).

      # After the release, not before, for the reason mobile-release.yml gives: action-gh-release
      # will not move a tag that already exists, and moving it first would leave a failed publish
      # pointing the link at bytes nobody published.
      - name: Move the rolling tag
        if: steps.version.outputs.tagged == 'false' && github.ref == 'refs/heads/master'
        shell: pwsh
        run: |
          git tag -f latest-windows $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Could not move the rolling tag.' }
          git push -f origin refs/tags/latest-windows
          if ($LASTEXITCODE -ne 0) { throw 'Could not push the rolling tag.' }

      - name: Publish the tagged release
        if: steps.version.outputs.tagged == 'true'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            dist/Flint-Setup-*.exe
            dist/Flint-Setup.exe
            dist/*.zip
            dist/*.nupkg
            dist/releases.win.json
          generate_release_notes: true
          body: |
            **Windows 10/11, 64-bit.** Download `Flint-Setup.exe` and run it: a per-user install, no
            administrator, Flint in the Start menu and `flint` on your PATH. The portable zip is here
            too for anyone who would rather extract a folder and run `Flint.App.exe`.

            The build is not code-signed, so Windows will show an unrecognised-publisher warning:
            choose **More info**, then **Run anyway**. Building from source avoids it.

            Check your Fire TV first — **Settings → My Fire TV → About**. Fire OS 7 or 8 works;
            Vega OS cannot, and no future version will change that.

            See the [installation guide](https://github.com/tochi-mba/flint-app-firestick-cast/blob/master/docs/INSTALL.md).
