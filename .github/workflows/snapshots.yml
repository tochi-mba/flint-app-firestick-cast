# Regenerates the approved Robolectric images, by hand.
#
# The snapshot suites hold rendered UI to approved PNGs, and a missing or changed image is a failure
# rather than an automatic approval -- which is right, and which also means a deliberate copy or
# layout change cannot be landed by anybody without an Android SDK. This is how that unblocks: run
# it, look at the images it produces, and commit the ones that are correct.
#
# It approves nothing itself. An approval is somebody deciding a rendered frame looks right, and a
# workflow cannot do that. What it can do, when asked with `push`, is commit the images it rendered
# to the branch it was run on, so that a reviewer without an Android SDK sees them in the pull
# request and decides there. The commit is the workflow's own, under the Actions bot, and it says
# which run rendered the images.
name: Snapshots

on:
  workflow_dispatch:
    inputs:
      modules:
        description: 'Gradle test tasks to regenerate against'
        required: false
        default: ':receiver:app:testDebugUnitTest :phone:design:testDebugUnitTest :phone:app:testDebugUnitTest'
      push:
        description: 'Commit the regenerated images to this branch for review'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: write

concurrency:
  group: snapshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Not the action's default packages: that list names the legacy `tools` package, which Google
      # has removed, so the default fails before anything builds. See the phone-gate action.
      - name: Install the Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      # FLINT_UPDATE_SNAPSHOTS is what the harness reads to overwrite rather than assert. Failures
      # are tolerated here on purpose: a test that fails for an unrelated reason should not stop the
      # images that did render from being collected.
      - name: Render and approve
        continue-on-error: true
        env:
          FLINT_UPDATE_SNAPSHOTS: '1'
        run: ./gradlew ${{ inputs.modules }} --console plain

      - name: Collect the images
        run: |
          set -euo pipefail
          mkdir -p regenerated
          found=0
          for module in apps/receiver/app apps/phone/design apps/phone/app; do
            directory="$module/src/test/snapshots/approved"
            if [ -d "$directory" ]; then
              mkdir -p "regenerated/$module"
              cp -r "$directory/." "regenerated/$module/"
              found=1
            fi
          done
          if [ "$found" != "1" ]; then
            echo "No snapshot directory was produced; nothing rendered." >&2
            exit 1
          fi
          find regenerated -name '*.png' -printf '%p %s bytes\n' | sort

      # Downloaded, looked at, and committed by a person. That last part is the point.
      - name: Upload the regenerated images
        uses: actions/upload-artifact@v4
        with:
          name: flint-snapshots
          path: regenerated/**
          retention-days: 14
          if-no-files-found: error

      # Only the images that changed, only on the branch this was run on, and only when asked.
      # A branch nobody dispatched this on is never written to.
      - name: Commit the regenerated images to this branch
        if: ${{ inputs.push == 'true' }}
        run: |
          set -euo pipefail
          # One directory at a time: `git add` refuses the whole command when any pathspec matches
          # nothing, and a module without a snapshot suite yet is the ordinary case.
          for module in apps/receiver/app apps/phone/design apps/phone/app; do
            directory="$module/src/test/snapshots/approved"
            [ -d "$directory" ] && git add -A -- "$directory"
          done
          if git diff --cached --quiet; then
            echo "No approved image changed; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --cached --stat
          git commit -m "Regenerate the approved snapshots" -m "Rendered by the Snapshots workflow, run ${{ github.run_id }}, against ${{ inputs.modules }}. The images are here to be looked at in the pull request; this commit approves nothing." 
          git push origin "HEAD:${{ github.ref_name }}"
