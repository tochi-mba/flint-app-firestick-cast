# The phone's one gate, so the pull-request run and the release run cannot diverge.
#
# They had. The release workflow ran a shorter list than the pull-request workflow did -- no
# :mobile:ktlintCheck, no :design:ktlintCheck, no :design:lintDebug -- which meant a release could
# ship code that would have been rejected on review. A composite action is the only way GitHub
# Actions lets two workflows share steps, so this is that.
name: Phone gate
description: Installs the toolchain and runs every check the phone app has to pass.

runs:
  using: composite
  steps:
    - name: Install JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'

    # ci.yml has no Gradle caching at all, so every Fire TV check there re-downloads the world.
    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Install the Android SDK
      uses: android-actions/setup-android@v3

    # Both versions. :receiver pins build-tools 35.0.0 and the release job builds it, so a runner
    # with only 36 fails there and nowhere else -- which is the hardest place to notice.
    - name: Install Android build tools
      shell: bash
      run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "build-tools;35.0.0"

    # The wire is shared with the Fire TV receiver, the Windows host and the Rust engine. A phone
    # change that breaks a golden vector has to fail here rather than on a television.
    - name: Check the shared protocol
      shell: bash
      run: ./gradlew :protocol:test --console plain

    # :castcore is Android-free on purpose, which is what lets it carry the same 95% line / 85%
    # branch gate as :protocol without Robolectric anywhere near it. `check` is tests, the coverage
    # verification, the source guards and ktlint.
    - name: Check the phone's pure logic
      shell: bash
      run: ./gradlew :castcore:check --console plain

    - name: Check the design system
      shell: bash
      run: ./gradlew :design:check :design:lintDebug --console plain

    - name: Check the phone app
      shell: bash
      run: ./gradlew :mobile:check :mobile:lintDebug --console plain
