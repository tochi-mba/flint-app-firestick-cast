# The phone's one gate, so the pull-request run and the release run cannot diverge.
#
# They had. The release workflow ran a shorter list than the pull-request workflow did -- no
# :phone:app:ktlintCheck, no :phone:design:ktlintCheck, no :phone:design:lintDebug -- which meant
# a release could ship code that would have been rejected on review. A composite action is the
# only way GitHub Actions lets two workflows share steps, so this is that.
name: Phone gate
description: Installs the toolchain and runs every check the phone app has to pass.

runs:
  using: composite
  steps:
    - name: Install JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'

    # ci.yml has no Gradle caching at all, so every Fire TV check there re-downloads the world.
    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4

    # `packages` is set because the action's default is `tools platform-tools`, and Google has since
    # removed the legacy `tools` package from the SDK repository: the default now fails with "Failed
    # to find package 'tools'" before anything is built. platform-tools is the half that still
    # exists; the platforms and build tools the modules need are installed by name below.
    - name: Install the Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: platform-tools

    # Both versions. :receiver:app pins build-tools 35.0.0 and the release job builds it, so a
    # runner with only 36 fails there and nowhere else -- which is the hardest place to notice.
    - name: Install Android build tools
      shell: bash
      run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "build-tools;35.0.0"

    # The wire is shared with the Fire TV receiver, the Windows host and the Rust engine. A phone
    # change that breaks a golden vector has to fail here rather than on a television.
    - name: Check the shared protocol
      shell: bash
      run: ./gradlew :protocol:check --console plain

    # :phone:core is Android-free on purpose, which is what lets it carry the same 95% line / 85%
    # branch gate as :protocol without Robolectric anywhere near it. `check` on both, because
    # `test` alone skips the coverage rule :protocol declares. `check` is tests, the coverage
    # verification, the source guards and ktlint.
    - name: Check the phone's pure logic
      shell: bash
      run: ./gradlew :phone:core:check --console plain

    - name: Check the design system
      shell: bash
      run: ./gradlew :phone:design:check :phone:design:lintDebug --console plain

    - name: Check the phone app
      shell: bash
      run: ./gradlew :phone:app:check :phone:app:lintDebug --console plain
